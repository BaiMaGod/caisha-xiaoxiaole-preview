name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/preview-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify compiled preview on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: |
          test -f web/index.html
          test -f web/canvas-preview.html
          for asset in web/assets/*.js; do node --check "$asset"; done
          test ! -d src
          test ! -d public
          mkdir -p "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview"
          cp -R web/. "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/pages-root" > "$RUNNER_TEMP/preview-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {chromium} = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            for (const [width,height] of [[390,844],[320,568],[768,1024]]) {
              const page = await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.goto('http://127.0.0.1:4173/caisha-xiaoxiaole-preview/',{waitUntil:'networkidle'});
              assert.equal(await page.evaluate(()=>Boolean(window.__legacyGame)),false);
              await page.locator('.caisha-home__play').click();
              assert.equal(await page.locator('.caisha-mode-menu__item').count(),3);
              // Both illustrated titles must render at the same width on every viewport.
              const getTitleSize = () => page.locator('.approved-art__headline').evaluate(async img => {
                await img.decode();
                const rect=img.getBoundingClientRect();
                const canvas=document.createElement('canvas');
                canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
                const ctx=canvas.getContext('2d',{willReadFrequently:true});
                ctx.drawImage(img,0,0);
                const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
                const bounds={left:canvas.width,top:canvas.height,right:-1,bottom:-1};
                let count=0;
                for(let y=0;y<canvas.height;y++) for(let x=0;x<canvas.width;x++) {
                  if(pixels[(y*canvas.width+x)*4+3]<64)continue;
                  count++;
                  bounds.left=Math.min(bounds.left,x);bounds.right=Math.max(bounds.right,x);
                  bounds.top=Math.min(bounds.top,y);bounds.bottom=Math.max(bounds.bottom,y);
                }
                const visibleWidth=(bounds.right-bounds.left+1)*rect.width/canvas.width;
                const visibleHeight=(bounds.bottom-bounds.top+1)*rect.height/canvas.height;
                return {width:rect.width,height:rect.height,visibleWidth,visibleHeight,bounds,count,
                  naturalWidth:canvas.width,naturalHeight:canvas.height};
              });
              const modeTitle=await getTitleSize();
              await page.locator('[data-mode="level"]').click();
              const levelTitle=await getTitleSize();
              console.log('TITLE_METRICS',JSON.stringify({viewport:[width,height],modeTitle,levelTitle}));
              assert.ok(Math.abs(modeTitle.width-levelTitle.width)<1,
                `title width mismatch on ${width}x${height}: ${modeTitle.width} vs ${levelTitle.width}`);
              assert.ok(Math.abs(modeTitle.height-levelTitle.height)<2,
                `title height mismatch on ${width}x${height}: ${modeTitle.height} vs ${levelTitle.height}`);
              await page.locator('.caisha-mode-menu__back').click();
              await page.locator('.approved-art__mode-picture').evaluateAll(images=>Promise.all(images.map(image=>image.decode())));
              // Check the visible illustration frames, not just CSS gap: fractional grid rows
              // previously expanded to absorb reduced gaps on mobile.
              const modeFrames = await page.locator('.approved-art__mode-frame').evaluateAll(nodes=>
                nodes.map(node=>{const r=node.getBoundingClientRect();return {top:r.top,bottom:r.bottom};}));
              assert.equal(modeFrames.length,3);
              for(let i=1;i<modeFrames.length;i++) {
                const visibleGap=modeFrames[i].top-modeFrames[i-1].bottom;
                assert.ok(visibleGap>=-1&&visibleGap<=7,`mode card visual gap ${visibleGap}px on ${width}x${height}`);
              }
              assert.equal(await page.locator('[data-mode="endless"] small').textContent(),
                '保持沙堆在红线之下，挑战高分。');
              await page.locator('[data-mode="level"]').click();
              assert.equal(await page.locator('.approved-art__level-card').count(),24);
              await page.locator('.approved-art__level-card').first().click();
              await page.getByRole('button',{name:'打开设置'}).click();
              assert.equal(await page.getByRole('slider').count(),2);
              await page.getByRole('button',{name:'返回主页'}).click();
              assert.equal(await page.getByRole('alertdialog').isVisible(),true);
              await page.getByRole('button',{name:'取消'}).click();
              assert.equal(await page.locator('.caisha-home').isVisible(),false);
              await page.getByRole('button',{name:'模式选择'}).click();
              assert.equal(await page.getByRole('alertdialog').isVisible(),true);
              await page.getByRole('button',{name:'确定返回'}).click();
              assert.equal(await page.locator('.caisha-mode-menu.is-open').isVisible(),true);
              await page.locator('[data-mode="endless"]').click();
              for (const title of ['重新生成沙块', '指定生成沙块']) {
                await page.locator('.caisha-prop-intro').waitFor({state:'visible'});
                assert.equal(await page.locator('.caisha-prop-intro h2').textContent(),title);
                await page.locator('.caisha-prop-intro').click();
                await page.waitForFunction(title=>document.querySelector('.caisha-prop-intro').hidden||
                  document.querySelector('.caisha-prop-intro h2').textContent!==title,title);
              }
              await page.locator('.caisha-prop-intro').waitFor({state:'hidden'});
              assert.match(await page.locator('[data-prop="regenerate"]').getAttribute('aria-label'),/剩余3次/);
              assert.match(await page.locator('[data-prop="specify"]').getAttribute('aria-label'),/剩余1次/);
              await page.locator('[data-prop="regenerate"]').click();
              assert.match(await page.locator('[data-prop="regenerate"]').getAttribute('aria-label'),/剩余2次/);
              await page.locator('[data-prop="specify"]').click();
              assert.equal(await page.locator('.caisha-prop-color').count(),5);
              await page.locator('.caisha-prop-shape[aria-pressed="false"]').first().click();
              await page.getByRole('button',{name:'确认生成'}).click();
              assert.match(await page.locator('[data-prop="specify"]').getAttribute('aria-label'),/剩余0次/);
              await page.getByRole('button',{name:'打开设置'}).click();
              await page.getByRole('button',{name:'返回主页'}).click();
              assert.equal(await page.getByRole('alertdialog').isVisible(),true);
              await page.getByRole('button',{name:'确定返回'}).click();
              assert.equal(await page.locator('.caisha-home').isVisible(),true);
              await page.locator('.caisha-home__play').click();
              await page.locator('[data-mode="sandArt"]').click();
              const artTools=page.locator('.caisha-art-studio');
              await artTools.waitFor({state:'visible'});
              await artTools.getByRole('button',{name:'固沙笔',exact:true}).click();
              await artTools.getByRole('button',{name:'紫色沙粒',exact:true}).click();
              await artTools.getByRole('button',{name:'笔刷·中',exact:true}).click();
              assert.equal(await artTools.locator('[data-tool="fixed"]').getAttribute('aria-pressed'),'true');
              assert.equal(await artTools.locator('[data-color="7"]').getAttribute('aria-pressed'),'true');
              assert.equal(await artTools.getByRole('button',{name:'笔刷·粗',exact:true}).isVisible(),true);
              const bounds=await page.evaluate(()=>{
                const shell=document.getElementById('game-shell').getBoundingClientRect();
                const board=document.getElementById('game-root').getBoundingClientRect();
                const top=document.querySelector('.caisha-art-studio__top').getBoundingClientRect();
                const palette=document.querySelector('.caisha-art-studio__palette').getBoundingClientRect();
                const controls=document.querySelector('.caisha-art-studio__controls').getBoundingClientRect();
                const bottom=document.querySelector('.caisha-art-studio__bottom').getBoundingClientRect();
                const toolRects=[...document.querySelectorAll('.caisha-art-studio__tool')]
                  .map(button=>button.getBoundingClientRect());
                const bottomTools=toolRects.length===4&&toolRects.every(r=>
                  Math.abs(r.top-toolRects[0].top)<2&&r.bottom<=bottom.bottom+1);
                const clipped=[...document.querySelectorAll('.caisha-art-studio button')].some(button=>{
                  const r=button.getBoundingClientRect();
                  return r.left<shell.left||r.right>shell.right||r.top<shell.top||r.bottom>shell.bottom;
                });
                return {clipped,bottomTools,clear:board.top>=top.bottom+5&&
                  board.left>=palette.right+2&&board.right<=controls.left-2&&board.bottom+5<=bottom.top};
              });
              assert.equal(bounds.clipped,false);
              assert.equal(bounds.bottomTools,true);
              assert.equal(bounds.clear,true);
              assert.equal(await artTools.locator('.caisha-art-studio__caption').textContent(),'沙画工坊');
              assert.ok(await artTools.locator('.caisha-art-studio__controls').evaluate(
                el=>el.getBoundingClientRect().width<=40));
              const artBoard=await page.locator('.game-canvas').boundingBox();
              await page.mouse.move(artBoard.x+artBoard.width*.5,artBoard.y+artBoard.height*.7);
              await page.mouse.down();
              await page.mouse.move(artBoard.x+artBoard.width*.54,artBoard.y+artBoard.height*.72,{steps:5});
              await page.mouse.up();
              await artTools.getByRole('button',{name:'完成',exact:true}).click();
              await page.locator('.caisha-result__headline').filter({hasText:'你的沙画完成啦！'}).waitFor();
              assert.deepEqual(errors,[]);
              await page.close();
            }
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/caisha-xiaoxiaole-preview/canvas-preview.html',{waitUntil:'networkidle'});
            assert.deepEqual(errors,[]);
            assert.equal(await page.evaluate(()=>Boolean(window.__canvasGame)),false);
            await page.close();
          } finally {await browser.close();}
          console.log('Verified compiled Web and Canvas preview');
          NODE
      - name: Verify level props in compiled preview
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: |
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/pages-root" > "$RUNNER_TEMP/props-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {chromium} = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            for (const [width,height] of [[320,568],[390,844],[768,1024]]) {
              const page = await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.addInitScript(()=>localStorage.setItem('qicai-modes-progress-v1',JSON.stringify({unlockedLevel:4})));
              await page.goto('http://127.0.0.1:4173/caisha-xiaoxiaole-preview/',{waitUntil:'networkidle'});
              assert.equal(await page.evaluate(()=>Boolean(window.__legacyGame)),false);
              await page.locator('.caisha-home__play').click();
              await page.locator('[data-mode="level"]').click();
              await page.locator('.approved-art__level-card').nth(3).click();
              for (const name of ['重新生成沙块','指定生成沙块']) {
                await page.locator('.caisha-prop-intro').waitFor({state:'visible'});
                assert.equal(await page.locator('.caisha-prop-intro h2').textContent(),name);
                await page.locator('.caisha-prop-intro').click();
                await page.waitForFunction(name=>document.querySelector('.caisha-prop-intro').hidden||
                  document.querySelector('.caisha-prop-intro h2').textContent!==name,name);
              }
              await page.locator('.caisha-prop-intro').waitFor({state:'hidden'});
              await page.locator('[data-prop="regenerate"]').click();
              assert.match(await page.locator('[data-prop="regenerate"]').getAttribute('aria-label'),/剩余2次/);
              await page.locator('[data-prop="specify"]').click();
              assert.equal(await page.locator('.caisha-prop-color').count(),3);
              await page.locator('.caisha-prop-shape[aria-pressed="false"]').first().click();
              await page.getByRole('button',{name:'确认生成'}).click();
              assert.match(await page.locator('[data-prop="specify"]').getAttribute('aria-label'),/剩余0次/);
              assert.equal(await page.locator('[data-prop="specify"]').isDisabled(),true);
              assert.deepEqual(errors,[]);
              await page.close();
            }
          } finally {await browser.close();}
          console.log('Verified level props, unlock intros and stock in production');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified preview
        id: deployment
        uses: actions/deploy-pages@v4

