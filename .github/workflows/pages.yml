name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check both Web and Canvas mini-game JavaScript
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { CanvasGame } from './src/runtime/CanvasGame.js';
          const game = Object.create(CanvasGame.prototype);
          let stopped = 0;
          game.platform = {stopSounds:()=>stopped++};
          game.selectedLevel = 2;
          game.handleGameOver({mode:'level'});
          assert.equal(game.screen,'fail','mini-game must use level-specific failure UI');
          assert.equal(stopped,1);
          console.log('All JS parses and CanvasGame level failure routes correctly');
          NODE
      - name: Run 12-level, art and save-data regressions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { GameSession } from './src/runtime/GameSession.js';
          import { GAME_MODES, countSand, touchesSupportedFinishLine } from './src/modes/ModeLogic.js';
          import { getPrototypeLevel } from './src/modes/Levels.js';
          import { SandGrid } from './src/SandGrid.js';
          import { CONFIG } from './src/config.js';
          let grid = new SandGrid();
          grid.set(10, CONFIG.DEATH_LINE_Y, 1);
          assert.equal(touchesSupportedFinishLine(grid), false);
          for (let y=CONFIG.DEATH_LINE_Y; y<grid.height; y++) grid.set(10,y,1);
          assert.equal(touchesSupportedFinishLine(grid), true);
          let artFinishes = 0;
          const art = new GameSession({onArtComplete:()=>artFinishes++});
          art.start(GAME_MODES.ART);
          for(let y=CONFIG.DEATH_LINE_Y; y<art.grid.height; y++){
            art.grid.set(25,y,2);
            art.art.fixed[art.grid.index(25,y)] = 1;
          }
          for(let i=0; i<4; i++) art.update(50,i*50);
          assert.equal(art.mode,'over');
          assert.equal(artFinishes,1);
          const local = new Map();
          const storage = {getItem:k=>local.get(k)||null,setItem:(k,v)=>local.set(k,v)};
          const unfinished = new GameSession({storage});
          unfinished.start(GAME_MODES.ART);
          unfinished.grid.set(19, 300, 4);
          unfinished.art.fixed[unfinished.grid.index(19,300)] = 1;
          unfinished.goHome();
          const resumed = new GameSession({storage});
          resumed.start(GAME_MODES.ART);
          assert.equal(resumed.grid.get(19,300),4,'draft must restore color');
          assert.equal(resumed.art.fixed[resumed.grid.index(19,300)],1,
            'draft must restore fixed grain');
          const shaped = new GameSession();
          shaped.start(GAME_MODES.ART);
          assert.equal(shaped.setArtTool('shape'),true);
          shaped.setPointerX(110);
          assert.equal(shaped.releaseFruit(),true);
          for(let yp=CONFIG.DEATH_LINE_Y;yp<shaped.grid.height;yp++){
            shaped.grid.set(17,yp,1);
            shaped.art.fixed[shaped.grid.index(17,yp)]=1;
          }
          shaped.update(50,0);
          assert.equal(shaped.artFinishing,true);
          assert.equal(shaped.fruitManager.enabled,true,
            'in-flight shape must remain simulated during finish');
          for(let n=1;n<150 && shaped.mode==='playing';n++)
            shaped.update(50,n*50);
          assert.equal(shaped.mode,'over','art frame must finish after shape falls');
          assert.ok(countSand(shaped.grid)>shaped.grid.height-CONFIG.DEATH_LINE_Y+100,
            'art frame includes the shaped sand grain contribution');
          for(let id=1;id<=12;id++){
            const level = getPrototypeLevel(id);
            const s = new GameSession();
            s.start(GAME_MODES.LEVEL,id);
            let frame=0;
            for(const action of level.solution){
              for(let k=0;k<1000 && s.mode==='playing';k++){
                if(s.fruitManager.current?.state==='CONTROL' &&
                   !s.settlementGate.isBlocking())break;
                s.update(50,++frame*50);
              }
              if(s.mode!=='playing')break;
              assert.equal(s.fruitManager.current.color,action.color,'level color');
              assert.equal(s.fruitManager.current.template.id,action.templateId,'level shape');
              s.setPointerX(action.centerX);
              assert.equal(s.releaseFruit(),true);
              for(let k=0;k<1000 && s.mode==='playing';k++){
                s.update(50,++frame*50);
                if(s.fruitManager.current?.state==='CONTROL' &&
                   !s.settlementGate.isBlocking())break;
              }
            }
            for(let k=0;k<1000 && s.mode==='playing';k++)s.update(50,++frame*50);
            assert.equal(s.mode,'over','level '+id+' must complete');
            assert.equal(countSand(s.grid),0,'level '+id+' must be fully empty');
          }
          console.log('Shared modes and all 12 verified level solutions passed');
          NODE

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
