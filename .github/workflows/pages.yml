name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'taptap-h5.zip'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact artifact hashes
        run: node .github/scripts/verify-artifact.mjs
      - name: Install browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/preview-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify shared compiled game
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: |
          test -f web/index.html
          test -f web/build-info.json
          test ! -d src
          test ! -d public
          for asset in web/assets/*.js; do node --check "$asset"; done
          mkdir -p "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview"
          cp -R web/. "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/pages-root" > "$RUNNER_TEMP/preview-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const info=JSON.parse(readFileSync('web/build-info.json','utf8'));
          assert.match(info.sourceHash,/^[a-f0-9]{64}$/);
          const {chromium}=await import(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          async function click(page,id) {
            await page.waitForFunction(id=>globalThis.__canvasGame?.buttons.some(b=>b.id===id&&!b.disabled),id);
            const p=await page.evaluate(id=>{const g=globalThis.__canvasGame,b=g.buttons.find(b=>b.id===id),s=g.metrics.uiScale;return{x:(b.x+b.w/2)*s,y:(b.y+b.h/2)*s};},id);
            await page.mouse.click(p.x,p.y);await page.waitForTimeout(50);
          }
          try {
            for(const [width,height] of [[390,844],[320,568],[1440,900],[844,390]]) {
              const page=await browser.newPage({viewport:{width,height}}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)errors.push(r.status()+' '+r.url());});
              const url='http://127.0.0.1:4173/caisha-xiaoxiaole-preview/';
              await page.goto(url,{waitUntil:'networkidle'});
              assert.equal(await page.evaluate(()=>typeof globalThis.__canvasGame),'undefined');
              await page.goto(url+'?debug=1',{waitUntil:'networkidle'});
              // The visible Canvas2D context must be compositor-synchronized:
              // every frame repaints the animated sand BEFORE overlaying the
              // fan cards and Start button. A desynchronized front buffer can
              // expose that intermediate cleared state as visible flashing.
              const displayAttributes=await page.evaluate(() =>
                globalThis.__canvasGame?.renderer?.displayCtx?.getContextAttributes?.()
              );
              assert.equal(displayAttributes?.desynchronized,false,
                'Canvas must not present partially drawn home UI');
              await page.waitForFunction(() => ['homeChallenge','homeEndless','homeArt'].every(k => {
                const image=globalThis.__canvasGame?.assets?.get(k);
                return image && image.complete && image.naturalWidth > 0;
              }));
              // V1.0 automatically opens the first-visit sign-in dialog.
              // Explicitly close it before verifying the fan carousel geometry.
              if (await page.evaluate(() => Boolean(globalThis.__canvasGame?.rewardPanel)))
                await click(page,'signin-close');
              const home=await page.evaluate(() => {
                const g=globalThis.__canvasGame;
                const b=id=>g.buttons.find(v=>v.id===id);
                return {
                  center: b('start').y+b('start').h/2,
                  halfHeight:g.metrics.stageHeight/2,
                  cards:['level','endless','sandArt'].map(mode=>({
                    mode,y:b('home-mode-'+mode).y,h:b('home-mode-'+mode).h,
                    bottom:b('home-mode-'+mode).y+b('home-mode-'+mode).h
                  })),
                  startTop:b('start').y
                };
              });
              assert.ok(Math.abs(home.center-home.halfHeight)<0.05);
              // The fan's rotated square hitbox includes transparent area;
              // visible-art spacing is verified from each fan's pose below.
              // Artwork sizes are checked below, independently of rotated hitboxes.
              // Arc geometry: active fan centered/highest, sides tilted outward.
              const pose=async()=>page.evaluate(()=>{
                const g=globalThis.__canvasGame;
                const list=['level','endless','sandArt'].map(mode=>{
                  const b=g.buttons.find(b=>b.id==='home-mode-'+mode);
                  return {mode,...b.homePose,bottom:b.y+b.h};
                });
                const start=g.buttons.find(b=>b.id==='start');
                return {
                  cards:list,startTop:start.y,startMiddle:start.y+start.h/2,
                  startVisibleCenterX:start.x+start.w/2-start.w*.036,
                  canvasCenterX:g.metrics.stageWidth/2
                };
              });
              const initially=await pose();
              const center=initially.cards[0],right=initially.cards[1],left=initially.cards[2];
              assert.ok(Math.abs(center.cx-width/(Math.min(1,width/405))*0.5)<1);
              assert.equal(center.slot,0);assert.equal(right.slot,1);assert.equal(left.slot,2);
              assert.ok(center.size>right.size && center.size>left.size);
              assert.ok(center.cy<right.cy && center.cy<left.cy);
              // Measure edge angles in the original 600x600 transparent fan
              // assets. A card rotates so its adjacent side line becomes
              // parallel to the corresponding straight edge of the center.
              const edges={
                level:{left:18.3,right:-19.3},
                endless:{left:17.7,right:-18.4},
                sandArt:{left:17.4,right:-17.9}
              };
              const assertParallel=({cards})=>{
                const center=cards.find(c=>c.slot===0);
                const left=cards.find(c=>c.slot===2);
                const right=cards.find(c=>c.slot===1);
                assert.ok(Math.abs(center.angle)<1e-5);
                const leftAdj=edges[left.mode].right-left.angle*180/Math.PI;
                const rightAdj=edges[right.mode].left-right.angle*180/Math.PI;
                assert.ok(Math.abs(leftAdj-edges[center.mode].left)<0.15,
                  'Left card right edge must parallel center card left edge');
                assert.ok(Math.abs(rightAdj-edges[center.mode].right)<0.15,
                  'Right card left edge must parallel center card right edge');
                assert.ok(left.angle<-0.60 && right.angle>0.60,
                  'Fan cards should turn outward roughly 36-37 degrees');
              };
              assertParallel(initially);
              // The Start PNG's painted center must match the fan's centered pose.
              // Its asymmetric transparent padding is compensated in the UI.
              assert.ok(Math.abs(initially.startVisibleCenterX-initially.canvasCenterX)<0.05);
              assert.ok(Math.abs(center.cx-initially.startVisibleCenterX)<0.05);
              assert.ok(Math.abs((left.cx+right.cx)/2-center.cx)<0.05);
              // Compare the visible alpha envelopes (not oversized square hitboxes).
              // Approximate bottom extents from the original 600x600 fan artwork.
              const visualBottom=c=>c.cy+c.size*(c.slot===0?.40:.48);
              const sideGap=initially.startTop-Math.max(visualBottom(right),visualBottom(left));
              const centerGap=initially.startTop-visualBottom(center);
              assert.ok(sideGap>4 && sideGap<25,'Side fan art too far or overlapping Start');
              assert.ok(centerGap>6 && centerGap<35,'Central fan art too far or overlapping Start');
              // Tap both sides and verify moving cards occupy the center in turn.
              await click(page,'home-mode-endless');await page.waitForTimeout(350);
              let switched=await pose();
              assert.equal(switched.cards[1].slot,0);
              assertParallel(switched);
              assert.ok(Math.abs(switched.cards[1].cx-center.cx)<1);
              assert.ok(Math.abs(switched.startMiddle-initially.startMiddle)<0.05);
              assert.ok(Math.abs(switched.cards[1].cx-switched.startVisibleCenterX)<0.05);
              await click(page,'home-mode-sandArt');await page.waitForTimeout(350);
              switched=await pose();assert.equal(switched.cards[2].slot,0);
              assertParallel(switched);
              await click(page,'home-mode-level');await page.waitForTimeout(350);
              await click(page,'start');await click(page,'level-1');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.ruleIntro),true);
              assert.deepEqual(await page.evaluate(()=>globalThis.__canvasGame.buttons.map(b=>b.id)),['rules-intro-confirm']);
              await click(page,'rules-intro-confirm');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.session.modeProgress.rulesIntroSeen),true);
              await click(page,'settings');
              assert.deepEqual(await page.evaluate(()=>
                globalThis.__canvasGame.buttons.filter(b=>['settings-home','settings-levels'].includes(b.id)).map(b=>b.id)
              ),['settings-home','settings-levels']);
              await click(page,'settings-levels');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.screen),'playing',
                'Asking to switch levels must not skip confirmation');
              await click(page,'confirm-cancel');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.settingsOpen),true);
              await click(page,'settings-levels');await click(page,'confirm-accept');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.screen),'levels');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.session.mode),'home');
              await click(page,'level-1');
              await click(page,'settings');await click(page,'settings-home');
              await click(page,'confirm-cancel');await click(page,'settings-home');await click(page,'confirm-accept');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.screen),'home');
              await click(page,'home-mode-sandArt');await click(page,'start');await click(page,'art-tool-fixed');
              const p=await page.evaluate(()=>{const g=globalThis.__canvasGame,b=g.metrics.board,s=g.metrics.uiScale;return{x:(b.x+b.width*.5)*s,y:(b.y+b.height*.6)*s};});
              await page.mouse.move(p.x,p.y);await page.mouse.down();await page.mouse.move(p.x+3,p.y+3);await page.mouse.up();
              assert.ok(await page.evaluate(()=>globalThis.__canvasGame.session.grid.cells.some(v=>v>0)));
              await click(page,'art-finish');await click(page,'home');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.screen),'home');
              assert.deepEqual(errors,[]);await page.close();
            }
          } finally {await browser.close();}
          console.log('Verified shared compiled preview',info);
          NODE
      - name: Verify 24-level response and exact sand pixels
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: node .github/scripts/performance.mjs
      - name: Verify compiled timing, idle redraw and clear budgets
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: node .github/scripts/runtime-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-acceptance
          path: .qa/
          include-hidden-files: true
      - name: Verify TapTap H5 package
        run: |
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          web = json.loads(Path('web/build-info.json').read_text())
          with zipfile.ZipFile('taptap-h5.zip') as z:
              prefix = 'caisha-xiaoxiaole/'
              names = z.namelist()
              assert all(n.startswith(prefix) for n in names)
              info = json.loads(z.read(prefix + 'build-info.json'))
              assert info['channel'] == 'taptap-h5'
              assert info['commit'] == web['commit']
              assert info['sourceHash'] == web['sourceHash']
              manifest = json.loads(z.read(prefix + 'artifact-sha256.json'))['files']
              assert set(names) == {prefix + p for p in manifest} | {prefix + 'artifact-sha256.json'}
              for p, h in manifest.items():
                  assert not p.endswith(('.ts', '.map', '.md'))
                  assert hashlib.sha256(z.read(prefix + p)).hexdigest() == h, p
              assert prefix + 'index.html' in names
          print('Verified H5 package', info)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taptap-h5-${{ github.sha }}
          path: taptap-h5.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified preview
        id: deployment
        uses: actions/deploy-pages@v4

