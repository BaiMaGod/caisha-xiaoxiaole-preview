name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/preview-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify shared compiled game
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preview-qa/node_modules/playwright/index.mjs
        run: |
          test -f web/index.html
          test -f web/build-info.json
          test ! -d src
          test ! -d public
          for asset in web/assets/*.js; do node --check "$asset"; done
          mkdir -p "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview"
          cp -R web/. "$RUNNER_TEMP/pages-root/caisha-xiaoxiaole-preview/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/pages-root" > "$RUNNER_TEMP/preview-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const info=JSON.parse(readFileSync('web/build-info.json','utf8'));
          assert.match(info.sourceHash,/^[a-f0-9]{64}$/);
          const {chromium}=await import(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          async function click(page,id) {
            await page.waitForFunction(id=>globalThis.__canvasGame?.buttons.some(b=>b.id===id&&!b.disabled),id);
            const p=await page.evaluate(id=>{const g=globalThis.__canvasGame,b=g.buttons.find(b=>b.id===id),s=g.metrics.uiScale;return{x:(b.x+b.w/2)*s,y:(b.y+b.h/2)*s};},id);
            await page.mouse.click(p.x,p.y);await page.waitForTimeout(50);
          }
          try {
            for(const [width,height] of [[390,844],[320,568],[1440,900],[844,390]]) {
              const page=await browser.newPage({viewport:{width,height}}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)errors.push(r.status()+' '+r.url());});
              const url='http://127.0.0.1:4173/caisha-xiaoxiaole-preview/';
              await page.goto(url,{waitUntil:'networkidle'});
              assert.equal(await page.evaluate(()=>typeof globalThis.__canvasGame),'undefined');
              await page.goto(url+'?debug=1',{waitUntil:'networkidle'});
              await page.waitForFunction(() => ['homeChallenge','homeEndless','homeArt'].every(k => {
                const image=globalThis.__canvasGame?.assets?.get(k);
                return image && image.complete && image.naturalWidth > 0;
              }));
              const home=await page.evaluate(() => {
                const g=globalThis.__canvasGame;
                const b=id=>g.buttons.find(v=>v.id===id);
                return {
                  center: b('start').y+b('start').h/2,
                  halfHeight:g.metrics.stageHeight/2,
                  cards:['level','endless','sandArt'].map(mode=>({
                    mode,y:b('home-mode-'+mode).y,h:b('home-mode-'+mode).h,
                    bottom:b('home-mode-'+mode).y+b('home-mode-'+mode).h
                  })),
                  startTop:b('start').y
                };
              });
              assert.ok(Math.abs(home.center-home.halfHeight)<0.05);
              assert.ok(home.cards.every(c=>c.bottom < home.startTop));
              assert.ok(home.cards[0].h > home.cards[1].h && home.cards[0].h > home.cards[2].h);
              await click(page,'home-mode-level');await click(page,'start');await click(page,'level-1');
              await click(page,'settings');await click(page,'settings-home');
              await click(page,'confirm-cancel');await click(page,'settings-home');await click(page,'confirm-accept');
              await click(page,'home-mode-sandArt');await click(page,'start');await click(page,'art-tool-fixed');
              const p=await page.evaluate(()=>{const g=globalThis.__canvasGame,b=g.metrics.board,s=g.metrics.uiScale;return{x:(b.x+b.width*.5)*s,y:(b.y+b.height*.6)*s};});
              await page.mouse.move(p.x,p.y);await page.mouse.down();await page.mouse.move(p.x+3,p.y+3);await page.mouse.up();
              assert.ok(await page.evaluate(()=>globalThis.__canvasGame.session.grid.cells.some(v=>v>0)));
              await click(page,'art-finish');await click(page,'home');
              assert.equal(await page.evaluate(()=>globalThis.__canvasGame.screen),'home');
              assert.deepEqual(errors,[]);await page.close();
            }
          } finally {await browser.close();}
          console.log('Verified shared compiled preview',info);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified preview
        id: deployment
        uses: actions/deploy-pages@v4
