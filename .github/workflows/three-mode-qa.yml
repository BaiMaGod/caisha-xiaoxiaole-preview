name: three-mode-qa
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/three-mode-qa.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime and browser test tools
        run: |
          npm install
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check mode mechanics with actual shared session
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { GameSession } from './src/runtime/GameSession.js';
          import { GAME_MODES, countSand, touchesSupportedFinishLine } from './src/modes/ModeLogic.js';
          import { getPrototypeLevel } from './src/modes/Levels.js';
          import { SandGrid } from './src/SandGrid.js';
          import { CONFIG } from './src/config.js';
          let grid = new SandGrid();
          grid.set(10, CONFIG.DEATH_LINE_Y, 1);
          assert.equal(touchesSupportedFinishLine(grid), false);
          for (let y=CONFIG.DEATH_LINE_Y; y<grid.height; y++) grid.set(10,y,1);
          assert.equal(touchesSupportedFinishLine(grid), true);
          let artFinishes = 0;
          const art = new GameSession({onArtComplete:()=>artFinishes++});
          art.start(GAME_MODES.ART);
          for(let y=CONFIG.DEATH_LINE_Y; y<art.grid.height; y++){
            art.grid.set(25,y,2);
            art.art.fixed[art.grid.index(25,y)] = 1;
          }
          for(let i=0; i<4; i++) art.update(50,i*50);
          assert.equal(art.mode,'over');
          assert.equal(artFinishes,1);
          const local = new Map();
          const storage = {getItem:k=>local.get(k)||null,setItem:(k,v)=>local.set(k,v)};
          const unfinished = new GameSession({storage});
          unfinished.start(GAME_MODES.ART);
          unfinished.grid.set(19, 300, 4);
          unfinished.art.fixed[unfinished.grid.index(19,300)] = 1;
          unfinished.goHome();
          const resumed = new GameSession({storage});
          resumed.start(GAME_MODES.ART);
          assert.equal(resumed.grid.get(19,300),4,'draft must restore color');
          assert.equal(resumed.art.fixed[resumed.grid.index(19,300)],1,
            'draft must restore fixed grain');
          for(let id=1;id<=12;id++){
            const level = getPrototypeLevel(id);
            const s = new GameSession();
            s.start(GAME_MODES.LEVEL,id);
            let frame=0;
            for(const action of level.solution){
              for(let k=0;k<1000 && s.mode==='playing';k++){
                if(s.fruitManager.current?.state==='CONTROL' &&
                   !s.settlementGate.isBlocking())break;
                s.update(50,++frame*50);
              }
              if(s.mode!=='playing')break;
              assert.equal(s.fruitManager.current.color,action.color,'level color');
              assert.equal(s.fruitManager.current.template.id,action.templateId,'level shape');
              s.setPointerX(action.centerX);
              assert.equal(s.releaseFruit(),true);
              for(let k=0;k<1000 && s.mode==='playing';k++){
                s.update(50,++frame*50);
                if(s.fruitManager.current?.state==='CONTROL' &&
                   !s.settlementGate.isBlocking())break;
              }
            }
            for(let k=0;k<1000 && s.mode==='playing';k++)s.update(50,++frame*50);
            assert.equal(s.mode,'over','level '+id+' must complete');
            assert.equal(countSand(s.grid),0,'level '+id+' must be fully empty');
          }
          console.log('Shared modes and all 12 verified level solutions passed');
          NODE
      - name: Build preview
        run: npm run build
      - name: Validate GitHub Pages project subdirectory build
        run: |
          mkdir -p /tmp/github-pages-root/caisha-xiaoxiaole-preview
          cp -R dist/. /tmp/github-pages-root/caisha-xiaoxiaole-preview/
          (python3 -m http.server 4173 --directory /tmp/github-pages-root > /tmp/static-preview.log 2>&1 &)
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/caisha-xiaoxiaole-preview/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:4173/caisha-xiaoxiaole-preview/',{waitUntil:'networkidle'});
          await page.locator('.caisha-home__play').waitFor({timeout:12000});
          await page.locator('.caisha-home__play').click();
          await page.locator('.caisha-mode-menu.is-open').waitFor();
          if(errors.length)throw new Error('Static Pages JS failed: '+errors.join(' | '));
          console.log('GitHub Pages subdirectory static build renders and opens mode picker');
          await browser.close();
          NODE
      - name: Start web preview
        run: |
          (npm run dev -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log
          exit 1
      - name: Test actual Chromium interface
        run: |
          mkdir -p qa-shots
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          await page.goto('http://127.0.0.1:5173/',{waitUntil:'networkidle'});
          await page.locator('.caisha-home__play').click();
          assert.equal(await page.locator('.caisha-mode-menu.is-open').count(),1,'mode chooser visible');
          await page.locator('.caisha-mode-menu__item').filter({hasText:'沙画模式'}).click();
          assert.equal(await page.locator('section[aria-label="沙画创作工具栏"]').isVisible(),true,'art toolbar visible');
          const canvas=page.locator('.game-canvas');
          const r=await canvas.boundingBox();
          assert(r && r.width>150 && r.height>280,'full board is visible');
          await page.mouse.move(r.x+r.width*.52,r.y+r.height*.75);
          await page.mouse.down();
          await page.mouse.move(r.x+r.width*.55,r.y+r.height*.74,{steps:8});
          await page.waitForTimeout(200);
          await page.mouse.up();
          const toolbar=await page.locator('section[aria-label="沙画创作工具栏"] > div').last().boundingBox();
          assert(toolbar && r.y + r.height <= toolbar.y + 2,
            'art palette must not cover playable sand board');
          await page.screenshot({path:'qa-shots/01-sand-art.png',fullPage:true});
          await page.evaluate(() => {
            const {grid,art} = window.__legacyGame;
            for(let y=48;y<320;y++){
              grid.set(31,y,1);
              art.fixed[grid.index(31,y)] = 1;
            }
          });
          await page.locator('.caisha-result__headline').filter({hasText:'你的沙画完成啦！'}).waitFor({timeout:10000});
          const artResultVisible = await page.evaluate(() => {
            const frame = document.querySelector('.caisha-result__frame');
            const art = document.querySelector('.caisha-result__art');
            const back = document.querySelector('.caisha-result__home');
            const ctx = art?.getContext('2d');
            if (!frame || !art || !back || !ctx) return false;
            // Pixel in the deliberately inserted red support column.
            const pixel = ctx.getImageData(31*3, 115*3, 1, 1).data;
            return Number(getComputedStyle(frame).opacity) >= 0.95 &&
              Number(getComputedStyle(back).opacity) >= 0.95 &&
              art.width >= 180 && art.height >= 320 &&
              pixel[0] > pixel[1] + 25 && pixel[0] > pixel[2] + 25;
          });
          assert(artResultVisible,
            'first visible result frame must show actual colored artwork and action buttons');
          const gearIsCovered = await page.evaluate(() => {
            const gear=document.querySelector('button[aria-label="打开设置"]');
            if (!gear) return false;
            const r=gear.getBoundingClientRect();
            return !gear.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2));
          });
          assert(gearIsCovered,'settings gear must not overlap completed artwork result');
          const downloadPromise = page.waitForEvent('download',{timeout:12000});
          await page.locator('.caisha-result__secondary').filter({hasText:'保存相册'}).click();
          const download=await downloadPromise;
          assert(download.suggestedFilename().endsWith('.png'),'artwork saves as PNG');
          await page.waitForTimeout(520);
          await page.screenshot({path:'qa-shots/05-art-finished.png',fullPage:true});
          await page.locator('.caisha-result__home').click();
          await page.locator('.caisha-home__play').click();
          await page.locator('.caisha-mode-menu__item').filter({hasText:'我的沙画'}).click();
          assert.equal(await page.locator('.caisha-mode-menu__levels').count(),0,
            'art gallery is independent from levels');
          await page.getByText('查看作品').first().waitFor();
          await page.screenshot({path:'qa-shots/07-art-gallery.png',fullPage:true});
          await page.getByText('关闭',{exact:true}).last().click();
          await page.locator('.caisha-home__play').click();
          await page.locator('.caisha-mode-menu__item').filter({hasText:'关卡模式'}).click();
          const levels=page.locator('.caisha-mode-menu__levels button');
          assert.equal(await levels.count(),12,'12 playable levels offered');
          await page.screenshot({path:'qa-shots/04-level-select.png',fullPage:true});
          await levels.first().click();
          await page.waitForTimeout(500);
          await page.screenshot({path:'qa-shots/02-level-1.png',fullPage:true});
          await page.evaluate(() => window.__legacyGame.triggerGameOver());
          await page.getByText('第 1 关挑战失败').waitFor();
          assert.equal(await page.locator('.caisha-result__headline:visible').count(),0,
            'level failure must not display endless framed artwork');
          await page.screenshot({path:'qa-shots/06-level-fail.png',fullPage:true});
          await page.getByText('重试本关').click();
          const solution = await page.evaluate(() => window.__legacyGame.getLevelGuideCenter());
          assert(Number.isFinite(solution),'development guide center available');
          const dropRect = await canvas.boundingBox();
          await page.mouse.click(dropRect.x + dropRect.width * solution / 180,
            dropRect.y + dropRect.height * .4);
          await page.getByText('第 1 关挑战成功！').waitFor({timeout:15000});
          await page.screenshot({path:'qa-shots/03-level-win.png',fullPage:true});
          assert.deepEqual(errors,[],'browser must not throw JS errors');
          await browser.close();
          console.log('Chromium mode switch, sand drawing, level select and screenshots passed');
          NODE
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-mode-browser-screenshots
          path: qa-shots/
          if-no-files-found: ignore
      - name: Upload built GitHub Pages release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-build
          path: dist/
          if-no-files-found: ignore
      - name: Upload preview runtime for isolated local QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-runtime-snapshot
          path: |
            src/
            public/
            index.html
            package.json
          if-no-files-found: ignore
