<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#30285c" />
    <title>梦幻沙画消除</title>
    <style>
      :root {
        font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #5c4939;
        background: #241f48;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 12%, #5b4779 0, #342b59 36%, #211d3e 100%);
      }

      body {
        overscroll-behavior: none;
      }

      .page-shell {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .game-shell {
        position: relative;
        width: min(calc(100vw - 36px), 405px);
        aspect-ratio: 9 / 16;
        max-height: calc(100vh - 36px);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 28px;
        background: #fff8ea;
        box-shadow:
          0 28px 80px rgba(17, 13, 40, 0.38),
          0 8px 28px rgba(17, 13, 40, 0.18);
        touch-action: none;
        user-select: none;
      }

      #game-root {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(100%, 405px, 56.25dvh);
        aspect-ratio: 9 / 16;
        transform: translate(-50%, -50%);
        overflow: hidden;
        background: #fff8ea;
      }

      #game-root canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        image-rendering: auto;
      }

      @media (max-width: 520px) {
        .page-shell {
          padding: 0;
        }

        .game-shell {
          width: 100vw;
          height: 100dvh;
          max-width: none;
          max-height: none;
          aspect-ratio: auto;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }

      @media (min-width: 521px) and (max-height: 700px) {
        .game-shell {
          height: calc(100vh - 24px);
          width: auto;
          max-width: calc(100vw - 24px);
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="game-shell" id="game-shell" aria-label="梦幻沙画消除游戏区域">
        <div id="game-root"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
